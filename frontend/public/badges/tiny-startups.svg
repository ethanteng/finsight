<svg xmlns="http://www.w3.org/2000/svg" width="255" height="88" viewBox="0 0 255 88">
  <!-- Tiny Startups supplies its "Launched on" badge as HTML, not an image.
       This is that badge redrawn at its own 255x88 so it can sit in an <img>.
       Text widths are pinned to the original's Inter measurements, so a
       fallback font cannot shift the layout. -->
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3525E6"/>
      <stop offset=".5" stop-color="#D81FE0"/>
      <stop offset="1" stop-color="#22B8F0"/>
    </linearGradient>
    <linearGradient id="spark" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#3525E6"/>
      <stop offset=".55" stop-color="#D81FE0"/>
      <stop offset="1" stop-color="#22B8F0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="253" height="86" rx="13" fill="#0E0B1F" stroke="url(#border)" stroke-width="2"/>
  <path transform="translate(20 16) scale(.56)" fill="url(#spark)" d="M50 6C52 32 68 48 94 50C68 52 52 68 50 94C48 68 32 52 6 50C32 48 48 32 50 6Z"/>
  <g fill="#fff" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="90" y="25.85" fill-opacity=".55" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9" font-weight="600" letter-spacing="1.62" textLength="75.8" lengthAdjust="spacing">LAUNCHED ON</text>
    <text x="90" y="48.7" font-size="22" font-weight="800" letter-spacing="-.55" textLength="141.2" lengthAdjust="spacing">Tiny Startups</text>
    <text x="90" y="67.49" fill-opacity=".55" font-size="11" textLength="87.06" lengthAdjust="spacing">tinystartups.com</text>
  </g>
</svg>
