name: Fast Deploy - Website Pages & Blog

on:
  push:
    branches: [ main ]
    # Marketing and content pages only. This pipeline skips the backend, integration
    # and security suites, so nothing that can affect the authenticated app belongs
    # here — application routes, build config and dependency manifests go through
    # ci-cd.yml instead. Keep this list in sync with that workflow's `paths-ignore`.
    paths:
      - 'frontend/src/app/page.tsx'
      - 'frontend/src/app/contact/**'
      - 'frontend/src/app/how-we-protect-your-data/**'
      - 'frontend/src/app/privacy/**'
      - 'frontend/src/app/terms/**'
      - 'frontend/src/app/blog/**'
      - 'frontend/src/app/use-cases/**'
      - 'frontend/src/app/prompts/**'
      - 'frontend/src/app/buying-a-house/**'
      - 'frontend/src/app/retirement-readiness/**'
      - 'frontend/src/app/features/**'
      - 'frontend/src/components/NewHomepage.tsx'
      - 'frontend/src/components/UseCasesPage.tsx'
      - 'frontend/src/components/RetirementUseCasePage.tsx'
      - 'frontend/src/components/HomeBuyingUseCasePage.tsx'
      - 'frontend/src/components/FinancialStressTestingUseCasePage.tsx'
      - 'frontend/src/components/PortfolioAnalysisUseCasePage.tsx'
      - 'frontend/src/components/PromptExamplePage.tsx'
      - 'frontend/src/components/RetirementReadinessPage.tsx'
      - 'frontend/src/components/BuyingAHousePage.tsx'
      - 'frontend/src/components/FeaturesPage.tsx'
      - 'frontend/src/components/StructuredData.tsx'
      - 'frontend/src/lib/ghost.ts'
      - 'frontend/src/lib/promptExamples.ts'
      - 'frontend/src/app/globals.css'
      - 'frontend/tailwind.config.js'
      - 'frontend/public/sitemap.xml'
      - 'frontend/public/robots.txt'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if no website page changes'
        required: false
        default: 'false'

concurrency:
  group: fast-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Quick validation for website pages and blog
  validate-website:
    # Bounded so a hung job fails in minutes rather than burning the
    # 360-minute default. Longest observed run of any job here is ~2.5 min.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    outputs:
      marketing_only: ${{ steps.scope.outputs.marketing_only }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so the guard below can diff against any push base.
          fetch-depth: 0

      # A `paths:` filter fires when ANY changed file matches, so a commit that
      # touches a marketing page and application code lands here as well as in
      # ci-cd.yml — and this pipeline would publish the whole commit (Vercel
      # builds the checked-out tree; the Render hook redeploys from branch HEAD)
      # before the full suite finishes. The deploy jobs below therefore run only
      # when every changed file is inside the marketing allowlist.
      - name: Check change scope
        id: scope
        run: bash scripts/check-fast-deploy-scope.sh "${{ github.event.before }}" "${{ github.sha }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit

      - name: Quick frontend validation
        run: |
          cd frontend
          # Basic TypeScript check (exclude tests for fast deployment)
          npm run type-check
          # Basic ESLint check (only critical errors, exclude tests)
          # Using --quiet to only show errors, warnings are ignored for fast deploy
          # Use locally installed ESLint via npm script to ensure dependencies are available
          npm run lint -- --quiet --ignore-pattern "**/__tests__/**" --ignore-pattern "**/*.test.*" --ignore-pattern "**/*.spec.*" || echo "ESLint warnings found but continuing..."

      # The whole frontend suite is ~4s, so this pipeline stays fast while no longer
      # shipping to production with zero tests.
      - name: Run frontend tests
        run: |
          cd frontend
          npm test -- --ci

      - name: Verify frontend build
        run: |
          cd frontend
          npm run build

  # Fast deployment to Vercel
  deploy-frontend:
    # Covers the Vercel production deploy round trip.
    timeout-minutes: 20
    needs: [validate-website]
    runs-on: ubuntu-latest
    # Deploy only a genuinely marketing-only push. Anything mixed is left to
    # ci-cd.yml, which tests before it ships. `force_deploy` is the explicit
    # manual override.
    if: |
      github.event.inputs.force_deploy == 'true' ||
      (github.ref == 'refs/heads/main' && needs.validate-website.outputs.marketing_only == 'true')
    # Shared with ci-cd.yml's deploy-frontend job — see the note there. Scoped to
    # the Vercel target so it does not queue behind a backend deploy.
    concurrency:
      group: production-deploy-frontend
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          target: production
          root-directory: frontend

  # Optional: Quick backend restart (if needed)
  # Runs alongside deploy-frontend rather than after it: both are gated on the
  # same validation job and the same marketing-only scope check, and the Render
  # hook does not depend on the Vercel deploy having landed.
  restart-backend:
    # A single webhook POST; anything approaching this is a hang.
    timeout-minutes: 10
    needs: [validate-website]
    runs-on: ubuntu-latest
    # Same scope gate as deploy-frontend: the Render hook redeploys the backend
    # from branch HEAD, so it must never fire for a commit carrying untested
    # backend changes.
    if: |
      github.event.inputs.force_deploy == 'true' ||
      (github.ref == 'refs/heads/main' && needs.validate-website.outputs.marketing_only == 'true')
    # Same Render webhook as ci-cd.yml's deploy-backend — must not overlap it.
    concurrency:
      group: production-deploy-backend
      cancel-in-progress: false
    steps:
      - name: Restart Render backend
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render restart via webhook..."
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Backend restart triggered successfully"
          else
            echo "No RENDER_DEPLOY_HOOK secret found, skipping backend restart"
          fi
