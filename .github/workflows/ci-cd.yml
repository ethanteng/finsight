          echo "🔒 Security Testing Complete!"
          echo "✅ Real Security Tests: Validated actual security implementation"
          echo "✅ Core Security Tests: Validated authentication and user isolation"
          echo "🛡️ Security Status: All critical security aspects validated"
          echo "🚀 Ready for production deployment"

  # Build Verification
  build-verification:
    runs-on: ubuntu-latest
    needs: [lint-and-test, backend-tests, frontend-build, integration-tests, security-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Security Validation Check
        run: |
          echo "🔒 Security Tests PASSED - Proceeding with build verification"
          echo "✅ All critical security aspects validated"
          echo "✅ User data isolation confirmed"
          echo "✅ Authentication enforcement confirmed"
          echo "✅ Database query security confirmed"
          echo "🚀 Build verification can proceed safely"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3: Installing dependencies..."
            if npm ci --prefer-offline --no-audit --include=dev; then break; fi
            if [ $i -eq 3 ]; then echo "Failed after 3 attempts"; exit 1; fi
            echo "Attempt $i failed, retrying in $((i * 10)) seconds..."
            sleep $((i * 10))
          done
          cd frontend
          for i in 1 2 3; do
            echo "Attempt $i of 3: Installing frontend dependencies..."
            if npm ci --prefer-offline --no-audit; then break; fi
            if [ $i -eq 3 ]; then echo "Failed after 3 attempts"; exit 1; fi
            echo "Attempt $i failed, retrying in $((i * 10)) seconds..."
            sleep $((i * 10))
          done

      - name: Enforce no-migrate-in-build
        run: bash scripts/check-no-migrate-in-build.sh

      - name: Verify backend build
        run: |
          npm run type-check
          npm run build:backend

      - name: Verify frontend build
        run: |
          cd frontend
          npm run build

  # Production Migration (only on main branch)
  migrate-prod:
    needs: [build-verification]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # requires manual approval in GitHub
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          for i in 1 2 3; do
            echo "Attempt $i of 3: Installing dependencies..."
            if npm ci --prefer-offline --no-audit; then break; fi
            if [ $i -eq 3 ]; then echo "Failed after 3 attempts"; exit 1; fi
            echo "Attempt $i failed, retrying in $((i * 10)) seconds..."
            sleep $((i * 10))
          done

      - name: Apply migrations with guards
        run: bash scripts/migrate-with-guards.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}

  # Deployment (only on main branch)
  deploy:
    runs-on: ubuntu-latest
    needs: [migrate-prod]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v42
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          target: production
          root-directory: frontend

      - name: Deploy to Render
        run: |
          echo "Deploying to Render..."
          
          # Option 1: Use Render webhook (requires RENDER_DEPLOY_HOOK secret)
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Triggering Render deployment via webhook..."
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
            echo "Render deployment triggered successfully"
          else
            echo "No RENDER_DEPLOY_HOOK secret found"
          fi
          
          # Option 2: Direct deployment with Render CLI (alternative approach)
          # if [ -n "${{ secrets.RENDER_API_KEY }}" ]; then
          #   echo "Installing Render CLI..."
          #   npm install -g @render/cli
          #   echo "Deploying to Render via CLI..."
          #   render deploy --service-id ${{ secrets.RENDER_SERVICE_ID }}
          # else
          #   echo "No RENDER_API_KEY secret found, skipping CLI deployment"
          # fi 