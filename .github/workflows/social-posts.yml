name: Draft Social Posts

# Emails ready-to-post social copy for blog posts that have just gone live.
# Keyed off Ghost's published state rather than the Soro feed, because the
# asklinc.com/blog/<slug> link in the copy only resolves once a post is
# published — and Soro imports land as drafts for review first.
#
# Runs every six hours so copy arrives soon after a post is approved. Each post
# is handled once; a Ghost internal tag records delivery, so extra runs are
# cheap and never re-send.
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the copy in the log without emailing or tagging'
        type: boolean
        default: false
      since_days:
        description: 'How far back to look for published posts'
        type: string
        default: '7'

concurrency:
  # Two concurrent runs would both see the same post as unsent.
  group: draft-social-posts
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Draft social copy for newly published posts
        env:
          GHOST_ADMIN_API_URL: ${{ secrets.GHOST_ADMIN_API_URL }}
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SOCIAL_EMAIL_TO: ${{ secrets.SOCIAL_EMAIL_TO }}
        run: npm run social -- --since-days=${{ inputs.since_days || '7' }} ${{ inputs.dry_run && '--dry-run' || '' }}
